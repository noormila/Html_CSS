<!-- Reference -->

<!-- | Property           | Think about                       |
| ------------------ | --------------------------------- |
| `flex-direction`   | Row or column?                    |
| `justify-content`  | Main-axis positioning             |
| `align-items`      | Cross-axis positioning of items   |
| `flex-wrap`        | Can items move to another line?   |
| `align-content`    | How multiple lines are positioned |
| `gap`              | Space between items               |
| `flex-grow`        | Can item take extra space?        |
| `flex-shrink`      | Can item give up space?           |
| `flex-basis`       | Starting/ideal size               |
| `min-width/height` | Don't go below this               |
| `max-width/height` | Don't exceed this                 |
| `overflow`         | What if content doesn't fit?      | -->
