<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link href="./Images/image8.jpg" rel="icon" />
    <link rel="stylesheet" href="./Lumina.css" />
    <title>Lumina Creative | Contact</title>
  </head>
  <body>
    <header class="header">
      <div class="container container-sm header-flex">
        <img src="./Images/image7.jpg" alt="Lumina Creative" class="logo" />
        <ul class="main-menu">
          <li><a href="./">Home</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./contact.html" class="current">Contact</a></li>
        </ul>
      </div>
    </header>

    <section class="contact-description">
      <div class="container container-sm">
        <h2>
          <span class="bg-primary-contact">Enthusiastic</span>
          <span>thinkers, creating unique endeavors powered by</span>
          <span class="bg-primary-contact"> creativity </span>
        </h2>
      </div>
    </section>

    <section class="contact">
      <div class="container container-sm">
        <h2 class="section-heading">Contact Us</h2>
        <p>
          Have a question? Leave your information below and we will get back to
          you as soon as possible
        </p>
        <form>
          <div class="form-group">
            <label for="first-name" class="visually-hidden">
                First Name
            </label>
            <input type="text" name="first-name" placeholder="First Name" />
          </div>
          <div class="form-group">
            <label for="last-name" class="visually-hidden">
                Last Name
            </label>
            <input type="text" name="last-name" placeholder="Last Name" />
          </div>
          <div class="form-group">
            <label for="email" class="visually-hidden">
                Email Address
            </label>
            <input type="text" name="email" placeholder="Email Address" />
          </div>
          <div class="form-group">
            <label for="message" class="visually-hidden">
                Message
            </label>
            <textarea name="message" id="message" placeholder="Message">

            </textarea>
          </div>
          <div class="form-group">
            <button class="btn" type="submit">Send Message</button>
          </div>
        </form>
      </div>
    </section>

    <footer class="footer">
      <div class="container footer-flex">
        <img src="./Images/image7.jpg" alt="Lumina Creative" />

        <div class="contact">
          <h4>Contact Us</h4>
          <ul>
            <li>(555) 555 555</li>
            <li>contact@lumina.test</li>
            <li>10 Main st Boston MA</li>
          </ul>
        </div>

        <div class="social">
          <h4>Follow Us</h4>
          <a href="#"><i class="fab fa-facebook fa-2x"> </i> </a>
          <a href="#"><i class="fab fa-instagram fa-2x"> </i> </a>
          <a href="#"><i class="fab fa-pinterest fa-2x"> </i> </a>
          <a href="#"><i class="fab fa-twitter fa-2x"> </i> </a>
          <a href="#"><i class="fab fa-tumblr fa-2x"> </i> </a>
        </div>
      </div>
    </footer>
  </body>
</html>
